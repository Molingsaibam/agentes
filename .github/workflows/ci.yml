name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run agent tests (BTC)
        run: npm run test:agents -- BTC
        env:
          NODE_ENV: test

      - name: Run backtest tests
        run: npm run test:backtests
        env:
          NODE_ENV: test

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (API)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: market-agents-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
